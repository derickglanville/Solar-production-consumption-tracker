<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solar Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css?v=20260723a">
</head>
<body data-page="entries">
  <nav class="navbar navbar-expand-lg tracker-nav">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="index.html">Solar Production & Consumption Tracker</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="index.html">Dashboard</a>
        <a class="nav-link" href="entries.html">Daily Entry</a>
        <a class="nav-link" href="contract-summary.html">Contract Summary</a>
        <a class="nav-link" href="settings.html">Settings</a>
        <a class="nav-link nav-link-button" href="dictionary.html">Dictionary</a>
      </div>
    </div>
  </nav>
  <main class="py-4">
    <div class="container">
      <div id="entries-status"></div>
      <div class="row g-4">
        <div class="col-lg-4">
          <div class="card tracker-card">
            <div class="card-body">
              <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-3">
                <div>
                  <div class="d-flex flex-wrap align-items-center gap-2 mb-1">
                    <h1 class="h4 mb-0">Daily Entry</h1>
                    <span id="entry-estimated-badge" class="entry-estimated-pill d-none">Estimated</span>
                    <span id="entry-source-badge" class="entry-source-pill d-none">Source: Manual</span>
                  </div>
                  <p class="text-muted mb-0" id="entry-form-mode">Create or update a daily solar record.</p>
                </div>
                <div class="d-flex flex-wrap gap-2">
                  <button type="button" id="entry-auto-create" class="btn btn-sun btn-sm">Add Daily Entry</button>
                  <button type="button" id="entry-refresh" class="btn btn-contract btn-sm">Refresh Data</button>
                </div>
              </div>
              <form id="entry-form" class="row g-3">
                <div class="col-12">
                  <label class="form-label">Date</label>
                  <input type="date" name="entry_date" class="form-control" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Solar Irradiance (Peak W/m²)</label>
                  <input type="number" step="0.1" name="irradiance_peak_wm2" class="form-control" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Sunrun Daily Production (kWh)</label>
                  <input type="number" step="0.1" name="production_kwh" class="form-control" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Meter 01 Import Reading</label>
                  <input type="number" step="0.1" name="meter_01_import_reading" class="form-control" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Meter 02 Export Reading</label>
                  <input type="number" step="0.1" name="meter_02_export_reading" class="form-control" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Weather</label>
                  <select name="weather" class="form-select">
                    <option>Sunny</option>
                    <option>Cloudy</option>
                    <option>Smoke</option>
                    <option>Rain</option>
                    <option>Snow</option>
                    <option>Overcast</option>
                    <option>Extreme Heat</option>
                    <option>Wind</option>
                    <option>Unknown</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Temperature (°F)</label>
                  <input type="number" step="0.1" name="temperature_f" class="form-control">
                </div>
                <div class="col-md-4">
                  <label class="form-label">Humidity %</label>
                  <input type="number" step="0.1" name="humidity_pct" class="form-control">
                </div>
                <div class="col-md-4">
                  <label class="form-label">Cloud Cover %</label>
                  <input type="number" step="0.1" name="cloud_cover_pct" class="form-control">
                </div>
                <div class="col-md-4">
                  <label class="form-label">Wind MPH</label>
                  <input type="number" step="0.1" name="wind_mph" class="form-control">
                </div>
                <div class="col-12">
                  <label class="form-label">Notes</label>
                  <textarea name="notes" rows="4" class="form-control"></textarea>
                </div>
                <div class="col-12 d-flex flex-wrap gap-2">
                  <button class="btn btn-sun" id="entry-save-button">Save Entry</button>
                  <button type="button" class="btn btn-contract" id="entry-clear-button">Clear Form</button>
                </div>
              </form>
            </div>
          </div>
        </div>
        <div class="col-lg-8">
          <div class="card tracker-card">
            <div class="card-body">
              <h2 class="h5 mb-3">Historical Entries</h2>
              <div class="table-responsive">
                <table class="table align-middle entries-history-table">
                  <thead>
                    <tr>
                      <th>Date</th>
                      <th>Prod.</th>
                      <th>Irradiance</th>
                      <th>M01</th>
                      <th>M02</th>
                      <th>Weather</th>
                      <th>Notes</th>
                      <th>Status</th>
                      <th>Actions</th>
                    </tr>
                  </thead>
                  <tbody id="entries-table-body"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/site-bootstrap.js?v=20260723a"></script>
  <script src="assets/js/firebase-config.js?v=20260723a"></script>
  <script type="module" src="assets/js/app-client.js?v=20260723a"></script>
</body>
</html>
