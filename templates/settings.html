{% extends "base.html" %}

{% block content %}
<div id="settings-status"></div>
<div class="row justify-content-center">
  <div class="col-xl-8">
    <div class="card tracker-card">
      <div class="card-body">
        <h1 class="h4 mb-4">Contract and Financial Settings</h1>
        <form id="settings-form" class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Production Guarantee (kWh/year)</label>
            <input type="number" step="0.1" name="production_guarantee_kwh" value="{{ config.production_guarantee_kwh }}" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label">Expected Offset %</label>
            <input type="number" step="0.1" name="expected_offset_pct" value="{{ config.expected_offset_pct }}" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label">Annual Home Usage (kWh)</label>
            <input type="number" step="0.1" name="annual_home_usage_kwh" value="{{ config.annual_home_usage_kwh }}" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label">Current Electric Rate ($/kWh)</label>
            <input type="number" step="0.001" name="current_electric_rate" value="{{ config.current_electric_rate }}" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label">NYSEG Monthly Fixed Charges</label>
            <input type="number" step="0.01" name="monthly_fixed_charges" value="{{ config.monthly_fixed_charges }}" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label">Sunrun Lease Payment</label>
            <input type="number" step="0.01" name="monthly_lease_payment" value="{{ config.monthly_lease_payment }}" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label">Sunrun Escalator %</label>
            <input type="number" step="0.01" name="sunrun_escalator_pct" value="{{ config.sunrun_escalator_pct }}" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label">Tree Removal Cost</label>
            <input type="number" step="0.01" name="tree_removal_cost" value="{{ config.tree_removal_cost }}" class="form-control">
          </div>
          <div class="col-12">
            <button class="btn btn-sun">Save Settings</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
